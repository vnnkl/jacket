; ESP32 firmware: Wi-Fi -> payment websocket -> Bluetooth LE -> Hello Fairy jacket.
; Pick the env matching your board (flash.sh detects it automatically).

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    links2004/WebSockets@^2.6.1
    h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=1 -DFIRMWARE_VERSION=\"0.3.1\"
board_build.partitions = min_spiffs.csv  ; two app slots for updates over Wi-Fi

[env:esp32]
platform = espressif32@^6.9.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
board_build.partitions = ${common.board_build.partitions}

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = ${common.board_build.partitions}

[env:esp32c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOOT_PIN=9
board_build.partitions = ${common.board_build.partitions}

; Host-side unit tests for the pure logic in lib/jacket_core: `pio test -e native`
[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags = -std=gnu++17
test_build_src = no
