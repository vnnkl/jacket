[project]
name = "jacket"
version = "0.1.0"
description = "Control the Hello Fairy LED jacket over Bluetooth and react to payments"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22", "websockets>=13"]

[project.scripts]
jacket = "jacket.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
