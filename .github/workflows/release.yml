# Builds the firmware for every supported board on each version tag (v*) and publishes the files
# as a GitHub release, so flash.sh can flash with plain esptool (no PlatformIO needed by users).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uvx --from platformio pio test -d esp32 -e native

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('esp32/platformio.ini') }}
      - run: uvx --from platformio pio run -d esp32 -e ${{ matrix.env }}
      - run: tools/collect_release.sh ${{ matrix.env }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
